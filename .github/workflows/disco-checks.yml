# INI-117 R4 live legs (L-R4-1..3): a Gate CI set reads this workflow. Removed after the legs (O-R4-10).
name: disco-checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: node --test --test-reporter=junit --test-reporter-destination=disco-junit.xml disco-checks/sum.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: disco-junit
          path: disco-junit.xml
  # Runs only on pushes to main, so the brake's breaking change (broken = true in disco-checks/main-state.mjs) passes a
  # pull request's checks and fails main.
  main-only:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: node disco-checks/main-health.mjs
